<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>epoche · reservoir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      padding: 24px 20px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.5;
      color: #1a1a1a;
      background: #f7f6f3;
      text-align: center;
    }

    h1 {
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .muted {
      color: #999;
      font-style: italic;
      font-size: 14px;
    }

    #pending {
      margin-top: 16px;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 11px;
      color: #666;
    }

    #last {
      margin-top: 16px;
      font-style: italic;
      color: #666;
    }

    button {
      margin-top: 20px;
      padding: 8px 24px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 0.1em;
      color: #1a1a1a;
      background: transparent;
      border: 1px solid #d4d4d4;
      cursor: pointer;
    }

    button:hover { border-color: #1a1a1a; }

    @media (prefers-color-scheme: dark) {
      body { color: #e8e6e1; background: #161513; }
      .muted { color: #7d7970; }
      #pending, #last { color: #a8a49c; }
      button { color: #e8e6e1; border-color: #36332f; }
      button:hover { border-color: #e8e6e1; }
    }
  </style>
</head>
<body>
  <h1>Reservoir</h1>
  <p class="muted">select text · right-click · add to reservoir</p>
  <p id="pending"></p>
  <p id="last"></p>
  <button id="open">open epoche</button>
  <script src="popup.js"></script>
</body>
</html>
